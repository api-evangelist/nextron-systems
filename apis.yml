aid: nextron-systems

name: Nextron Systems

description: Nextron Systems (Nextron Systems GmbH) builds automated forensic analysis and compromise assessment tooling under the tagline "We
  Detect Hackers". Its products include the THOR scanner, THOR Lite, THOR Cloud, THOR Thunderstorm (a web service that scans uploaded samples,
  with an OpenAPI description published on GitHub), ASGARD Management Center, Analysis Cockpit and the Aurora agent, used to uncover traces of
  hacking activity, configuration backdoors and obfuscated malware across diverse systems including legacy and edge devices.

