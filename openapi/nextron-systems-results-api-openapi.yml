          - data: '%*s  Persist        : %08x - %u - %s'
            offset: 919056
            field: /content
          - data: '%*s**DOMAINKEY**'
            offset: 950688
            field: /content
        - type: reason
          summary: Another rule
          signature:
            score: 80
            reference:
            - Some reference
            origin: internal
            kind: YARA Rule
            date: '2016-02-05'
            tags:
            - T1059_001
            rule_name: Another_Rule_Name
            description: Detects Something other
          matched:
          - data: kuhl_m_lsadump_getUsersAndSamKey ; kull_m_registry_RegOpenKeyEx SAM Accounts (0x%08x)
            offset: 1100540
