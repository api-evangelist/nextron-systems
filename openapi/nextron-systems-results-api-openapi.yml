openapi: 3.2.0
info:
  title: THOR Thunderstorm Results API
  description: This API allows you to send files to THOR to scan them and provides information about the running THOR instance.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local THOR instance
tags:
- name: Results
  description: Endpoints to retrieve results of asynchronous scans
paths:
  /getAsyncResults:
    get:
      summary: Retrieve the results of an asynchronous file check
      description: Retrieve the results of an asynchronous file check.
      tags:
      - Results
      operationId: getAsyncResults
      parameters:
      - description: Sample ID
        name: id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SampleId'
      responses:
        '200':
          description: Returns a JSON with the current status and, if applicable, the results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Error:
      description: Error with message
      type: object
      properties:
        message:
          description: Error message describing the problem
          type: string
      required:
      - message
    SampleId:
      description: Sample ID returned for an asynchronous scan request
      type: integer
      format: int64
      example: 12345
    AsyncResult:
      description: Result object for asynchronous scan operations
      type: object
      properties:
        status:
          description: Current status of the scan
          type: string
          example: Currently being scanned
        result:
          $ref: '#/components/schemas/ThorReport'
      required:
      - status
      example:
        result:
        - type: THOR finding
          meta:
            time: '2026-01-19T16:08:27.809483955+01:00'
            level: Warning
            module: HTTPServer
            scan_id: S-qiVIo7fm2Yk-4
            hostname: 127.0.0.1
          message: Suspicious file found
          subject:
            type: file
            path: 6700758b14fe8ac1bbcbbf3d652613d8
            exists: 'yes'
            extension: ''
            magic_header: UNKNOWN
            hashes:
              md5: ffc74d5afc22d1f1c785f98154cc7bae
              sha1: 9603a4806528578686dc5f02b805c64414b3c91b
              sha256: da1d2378fbacf84d09d18a94def83cd3bfc06e89e7429ba3de57cd96a0e04a87
            first_bytes:
              hex: 2f2a0ae8aeade8aeb0200a5b726577726974655f
              ascii: /* [rewrite_
            size: 5369
            permissions: null
            content:
              type: sparse data
              elements:
              - offset: 273
                data: var _0x
              length: 5369
          score: 79
          reasons:
          - type: reason
            summary: YARA rule OBFUSC
            signature:
              score: 65
              origin: internal
              kind: YARA Rule
              date: '2025-03-29'
              tags:
              - OBFUS
              rule_name: OBFUSC
              description: Detects obfuscated JavaScript code
            matched:
            - data: ''']=!![];}'
              offset: 3865
              field: /content
          reason_count: 1
          context: null
          log_version: v3.0.0
        status: Sample analysis complete
    ThorReport:
      description: THOR Report containing findings
      type: array
      items:
        $ref: '#/components/schemas/ThorFinding'
      example:
      - type: THOR finding
        meta:
          time: '2026-01-16T13:35:34.11133172+01:00'
          level: Alert
          module: HTTPServer
          scan_id: S-qkQv5yHIUHk-2
          hostname: 127.0.0.1
        message: Malicious file found
        subject:
          type: file
          path: somefile.exe
          exists: 'yes'
          extension: .exe
          magic_header: EXE
          hashes:
            md5: 7168892693d7716220d98883fffd848c
            sha1: 42acd9b554e1c843a9f8139022b560de0bf48682
            sha256: 660464c473c47784d8820d3e268c0d1327ac22ce0e607dc35e858628c53f0687
          first_bytes:
            hex: 4d5a90000300000004000000ffff0000b8000000
            ascii: MZ
          size: 1352192
          permissions: null
          content:
            type: sparse data
            elements:
            - offset: 856110
              data: '>`ncrypt.dll'
            length: 1352192
        score: 94
        reasons:
        - type: reason
          summary: some YARA rule
          signature:
            score: 85
            reference:
            - Internal Research
            origin: internal
            kind: YARA Rule
            date: '2023-05-12'
            tags:
            - EXE
            - HKTL
            rule_name: Some_Rule_Name
            description: Detects Something
          matched:
          - data: '%*s**CREDENTIAL**'
            offset: 918480
